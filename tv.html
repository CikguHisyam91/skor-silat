<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papan Skor — Silat Tanding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Papan skor TV: sentiasa mod malam (neumorphism gelap) */
  :root{
    --bg:#22262e;--ink:#e7ecf3;--muted:#8a94a6;--gold:#ffc83d;--line:#2f3540;
    --merah:#ff5b61;--biru:#5b8cff;--ok:#2ed48a;--amaran:#ffb020;--hi:#2d323c;--lo:#15181d;
    --timbul:1.1vh 1.1vh 2.4vh var(--lo),-1.1vh -1.1vh 2.4vh var(--hi);
    --tenggelam:inset .7vh .7vh 1.4vh var(--lo),inset -.7vh -.7vh 1.4vh var(--hi);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:"Urbanist",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;cursor:default;text-transform:uppercase;letter-spacing:.03em}
  .num{font-variant-numeric:tabular-nums}
  .tv{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:2.4vh;padding:2.6vh 1.8vw;position:relative}
  .tv-top{display:flex;align-items:center;justify-content:space-between;padding:1.5vh 2vw;border-radius:2.4vh;box-shadow:var(--timbul)}
  .tv-top .t{font-size:2vh;letter-spacing:.22em;color:var(--muted);font-weight:800}
  .tv-top .t span{color:var(--gold)}
  .tv-body{display:grid;grid-template-columns:1fr 24vw 1fr;gap:2.4vh 1.6vw;min-height:0}
  .side{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:3vh 1.6vw 2.6vh;overflow:hidden;border-radius:3.2vh;box-shadow:var(--timbul);transition:box-shadow .3s}
  .label{font-size:3.6vh;font-weight:900;letter-spacing:.38em}
  .side.merah .label,.side.merah .score{color:var(--merah)}
  .side.biru .label,.side.biru .score{color:var(--biru)}
  .chip{font-weight:800;font-size:4vh;margin-top:1.2vh;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pas{font-size:2.6vh;font-weight:700;color:var(--muted);margin-top:.4vh;min-height:3vh}
  .score{font-size:28vh;font-weight:900;line-height:.95;margin:auto 0}
  .huk{display:flex;gap:1.4vh;align-items:center;justify-content:center;flex-wrap:wrap;min-height:10.6vh;padding:1.3vh 2vh;border-radius:6vh;box-shadow:var(--tenggelam)}
  .huk:empty{box-shadow:none}
  .bulat{width:8vh;height:8vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:3vh;color:#fff;background:var(--merah);
    box-shadow:.6vh .6vh 1.2vh var(--lo),-.6vh -.6vh 1.2vh var(--hi),inset 0 -.5vh .9vh rgba(0,0,0,.2)}
  .bulat.ringan{background:var(--amaran);color:#3a2600}
  .bulat.baru{animation:pop .6s ease}
  .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 1.5vw;border-radius:3.2vh;box-shadow:var(--tenggelam)}
  .round{font-size:2.8vh;letter-spacing:.26em;color:var(--muted);font-weight:800}
  .kat{font-size:2.3vh;font-weight:800;color:var(--gold);letter-spacing:.1em;text-align:center;margin-top:1vh}
  .timer{font-size:14vh;font-weight:900;margin:1.5vh 0;line-height:1}
  .timer.run{color:var(--gold)}
  .timer.end{color:var(--merah);animation:blink 1s infinite}
  .dots{display:flex;gap:1vw}
  .dots i{width:1.6vh;height:1.6vh;border-radius:50%;background:var(--lo);display:block;box-shadow:var(--tenggelam)}
  .dots i.on{background:var(--gold);box-shadow:0 0 1.2vh var(--gold)}
  .legenda{display:flex;flex-direction:column;gap:.8vh;margin-top:3vh;font-size:1.7vh;font-weight:800;color:var(--muted)}
  .legenda span{display:flex;align-items:center;gap:.8vh}
  .legenda i{width:1.8vh;height:1.8vh;border-radius:50%;display:block}
  .ticker{display:none;align-items:stretch;height:6vh;overflow:hidden;border-radius:3vh;box-shadow:var(--tenggelam)}
  .ticker.show{display:flex}
  .tk-lbl{color:var(--gold);font-weight:900;font-size:2.2vh;letter-spacing:.2em;display:flex;align-items:center;padding:0 2vw;white-space:nowrap;border-radius:3vh;box-shadow:var(--timbul)}
  .tk-win{flex:1;overflow:hidden;position:relative;display:flex;align-items:center}
  .tk-run{position:absolute;white-space:nowrap;font-size:2.6vh;font-weight:800;color:var(--gold);letter-spacing:.05em;padding-left:100%;animation:tkGerak var(--tk-dur,30s) linear infinite}
  @keyframes tkGerak{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  .foot{padding:1.4vh;text-align:center;font-size:1.6vh;letter-spacing:.26em;color:var(--muted);font-weight:700;border-radius:3vh;box-shadow:var(--tenggelam)}
  @keyframes blink{50%{opacity:.35}}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
  .pop{animation:pop .5s ease}
  @keyframes glowM{30%{box-shadow:var(--timbul),inset 0 0 10vh rgba(255,91,97,.55)}}
  @keyframes glowB{30%{box-shadow:var(--timbul),inset 0 0 10vh rgba(91,140,255,.55)}}
  .glowM{animation:glowM .8s ease}.glowB{animation:glowB .8s ease}
  @keyframes notisIn{0%{opacity:0;transform:translate(-50%,-2vh)}100%{opacity:1;transform:translate(-50%,0)}}
  .penalti{position:absolute;top:2.5vh;left:50%;transform:translateX(-50%);padding:1.4vh 2.4vw;border-radius:2vh;font-weight:900;font-size:3.2vh;color:#fff;white-space:nowrap;display:none;z-index:4;box-shadow:var(--timbul)}
  .penalti.show{display:block;animation:notisIn .3s ease}
  .side.merah .penalti{background:var(--merah)}
  .side.biru .penalti{background:var(--biru)}
  .crown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(34,38,46,.9);z-index:5;border-radius:3.2vh}
  .crown.show{display:flex}
  .crown .c{font-size:14vh}
  .crown .w{font-size:6vh;font-weight:900;letter-spacing:.14em;margin-top:1vh}
  .crown.merah .w{color:var(--merah)}.crown.biru .w{color:var(--biru)}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(34,38,46,.94);backdrop-filter:blur(4px);z-index:8;padding:4vh}
  .overlay.show{display:flex}
  .o-eye{font-size:3vh;letter-spacing:.3em;color:var(--gold);font-weight:800}
  .o-title{font-size:7vh;font-weight:900;margin:2.5vh 0;line-height:1.2}
  .o-sub{color:var(--muted);font-size:3.2vh;font-weight:700}
  .o-votes{display:flex;gap:5vw;margin-top:3vh;font-size:4.5vh;font-weight:900}
  .o-votes span{padding:2vh 3vw;border-radius:2.4vh;box-shadow:var(--timbul)}
  .o-votes .ya{color:var(--ok)}.o-votes .tidak{color:var(--merah)}
  .o-res{font-size:14vh;font-weight:900}
  .o-res{font-size:9vh;margin:2vh 0}
  .o-res.km,.o-votes .km{color:var(--merah)}.o-res.kb,.o-votes .kb{color:var(--biru)}.o-res.kt,.o-votes .kt{color:var(--muted)}
  .start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3vh;background:var(--bg)}
  .start button{border:none;background:var(--bg);color:var(--gold);border-radius:3vh;padding:3vh 5vw;font-size:3.4vh;font-weight:900;cursor:pointer;font-family:inherit;text-transform:uppercase;box-shadow:var(--timbul)}
  .start button:active{box-shadow:var(--tenggelam)}
  .start p{color:var(--muted);font-size:2.2vh;margin:0;font-weight:700}
  .conn{position:fixed;right:1vw;bottom:1vh;width:1.4vh;height:1.4vh;border-radius:50%;background:var(--merah);z-index:9}
  .conn.on{background:var(--ok);box-shadow:0 0 1vh var(--ok)}
</style>
</head>
<body>
<div class="tv">
  <div class="tv-top"><div class="t">Silat <span>Tanding</span> — Kejohanan</div><div class="t" id="topInfo">Perlawanan -</div></div>
  <div class="tv-body">
    <div class="side merah" id="sideM">
      <div class="penalti" id="penM"></div>
      <div class="crown merah" id="crownM"><div class="c">👑</div><div class="w">Merah Menang</div></div>
      <div class="label">Merah</div><div class="chip" id="nmM">Pesilat Merah</div><div class="pas" id="pasM"></div><div class="score num" id="skM">0</div><div class="huk" id="hukM"></div>
    </div>
    <div class="mid">
      <div class="round" id="round">Babak 1</div>
      <div class="kat" id="kat"></div>
      <div class="timer num" id="timer">2:00</div>
      <div class="dots" id="dots"></div>
      <div class="legenda"><span><i style="background:var(--amaran)"></i>Ringan / Sederhana</span><span><i style="background:var(--merah)"></i>Berat</span></div>
    </div>
    <div class="side biru" id="sideB">
      <div class="penalti" id="penB"></div>
      <div class="crown biru" id="crownB"><div class="c">👑</div><div class="w">Biru Menang</div></div>
      <div class="label">Biru</div><div class="chip" id="nmB">Pesilat Biru</div><div class="pas" id="pasB"></div><div class="score num" id="skB">0</div><div class="huk" id="hukB"></div>
    </div>
  </div>
  <div class="ticker" id="ticker"><div class="tk-lbl">SETERUSNYA</div><div class="tk-win"><div class="tk-run" id="tkRun"></div></div></div>
  <div class="foot" id="footTv">Sri Gayong Panglima Ulung &nbsp;•&nbsp; Sistem Skor Silat Tanding</div>
  <div class="overlay" id="overlay"></div>
</div>
<div class="start" id="start"><button id="btnStart">📺 Mula Paparan Skrin Penuh</button><p>Klik sekali untuk skrin penuh dan bunyi.</p></div>
<div class="conn" id="conn"></div>

<script>
"use strict";
var DB_URL = "https://skor-silatolahraga-default-rtdb.asia-southeast1.firebasedatabase.app";
var ROOT = "/silat";

function fbUrl(p){ return DB_URL + ROOT + p + ".json"; }
function setPath(obj, path, val){
  var parts = path.split("/").filter(function(x){ return x.length > 0; });
  if(parts.length === 0){ return val; }
  if(obj === null || typeof obj !== "object"){ obj = {}; }
  var cur = obj;
  for(var i = 0; i < parts.length - 1; i++){
    if(cur[parts[i]] === null || typeof cur[parts[i]] !== "object"){ cur[parts[i]] = {}; }
    cur = cur[parts[i]];
  }
  var last = parts[parts.length - 1];
  if(val === null){ delete cur[last]; } else { cur[last] = val; }
  return obj;
}
function fbListen(p, onData, onStatus){
  var cache = null, es = null, akhir = Date.now();
  function buka(){
    if(es){ try{ es.close(); }catch(e){} }
    es = new EventSource(fbUrl(p));
    es.addEventListener("put", function(e){ akhir = Date.now(); var m = JSON.parse(e.data); cache = setPath(cache, m.path, m.data); onData(cache); onStatus(true); });
    es.addEventListener("patch", function(e){
      akhir = Date.now();
      var m = JSON.parse(e.data); var d = m.data || {};
      Object.keys(d).forEach(function(k){ cache = setPath(cache, (m.path === "/" ? "" : m.path) + "/" + k, d[k]); });
      onData(cache); onStatus(true);
    });
    es.addEventListener("keep-alive", function(){ akhir = Date.now(); onStatus(true); });
    es.onopen = function(){ akhir = Date.now(); onStatus(true); };
    es.onerror = function(){ onStatus(false); };
  }
  buka();
  /* sambung semula automatik jika talian putus atau senyap terlalu lama */
  setInterval(function(){
    if(es.readyState === 2 || Date.now() - akhir > 45000){ akhir = Date.now(); buka(); }
  }, 5000);
  return es;
}

function el(id){ return document.getElementById(id); }
function setTxt(id, v){ var n = el(id); if(n){ n.textContent = v; } }
function fmtMasa(s){ s = s || 0; var m = Math.floor(s / 60), ss = s % 60; return m + ":" + (ss < 10 ? "0" : "") + ss; }
function teksKeputusan(b){
  var j = labelJenis(b.jenis);
  if(b.keputusan === "merah"){ return "🔴 " + j + " Sudut Merah ✔"; }
  if(b.keputusan === "biru"){ return "🔵 " + j + " Sudut Biru ✔"; }
  if(b.keputusan === "tiada"){ return "✖ Tiada " + j; }
  return "Tiada keputusan (undi berbeza)";
}
function kelasKeputusan(k){ return k === "merah" ? "km" : (k === "biru" ? "kb" : "kt"); }
function labelJenis(j){ return j === "pelanggaran" ? "Pelanggaran" : "Jatuhan"; }
function labelSisi(s){ return s === "merah" ? "Merah" : "Biru"; }
function ulangAnim(node, cls){ node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }

var audioCtx = null;
function beep(freq, dur){
  try{
    if(!audioCtx){ return; }
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = freq; g.gain.value = 0.06;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

var lama = null;
var notisTimer = null;
function render(s){
  if(!s){ return; }
  var p = lama || {};
  setTxt("nmM", s.namaMerah || "Pesilat Merah");
  setTxt("nmB", s.namaBiru || "Pesilat Biru");
  var tk = s.ticker || "";
  if(tk !== (p.ticker || "") || !lama){
    var run = el("tkRun"); run.textContent = tk ? tk + "          " + tk : "";
    run.style.setProperty("--tk-dur", Math.max(20, Math.round(tk.length * 0.35)) + "s");
    el("ticker").classList.toggle("show", !!tk); el("footTv").style.display = tk ? "none" : "";
  }
  setTxt("pasM", s.pasukanMerah || ""); setTxt("pasB", s.pasukanBiru || "");
  setTxt("kat", [s.kategori, s.kelas].filter(function(x){ return x; }).join(" • "));
  setTxt("skM", s.skorMerah || 0);
  setTxt("skB", s.skorBiru || 0);
  setTxt("topInfo", "Perlawanan " + (s.noPerlawanan || "-") + "  •  Babak " + (s.babak || 1) + "/" + (s.jumlahBabak || 3));
  setTxt("round", "Babak " + (s.babak || 1));
  var t = el("timer"); t.textContent = fmtMasa(s.masaBaki);
  t.classList.toggle("run", !!s.masaJalan); t.classList.toggle("end", !!s.masaTamat);
  var h = ""; for(var i = 1; i <= (s.jumlahBabak || 3); i++){ h += "<i class=\"" + (i <= (s.babak || 1) ? "on" : "") + "\"></i>"; }
  el("dots").innerHTML = h;

  if(lama){
    if((s.skorMerah || 0) > (p.skorMerah || 0)){ ulangAnim(el("skM"), "pop"); ulangAnim(el("sideM"), "glowM"); beep(880, 0.12); }
    if((s.skorBiru || 0) > (p.skorBiru || 0)){ ulangAnim(el("skB"), "pop"); ulangAnim(el("sideB"), "glowB"); beep(880, 0.12); }
    if(s.masaTamat && !p.masaTamat){ beep(440, 0.8); }
  }
  /* popup pelanggaran */
  var n = s.tvNotis;
  if(n && n.id && (!p.tvNotis || p.tvNotis.id !== n.id) && lama){
    var pm = el("penM"), pb = el("penB");
    pm.className = "penalti"; pb.className = "penalti";
    var sasaran = n.sisi === "merah" ? pm : pb;
    sasaran.textContent = "⚠ " + n.teks;
    sasaran.className = "penalti show";
    beep(300, 0.2);
    clearTimeout(notisTimer);
    notisTimer = setTimeout(function(){ pm.className = "penalti"; pb.className = "penalti"; }, 4500);
  }
  /* simbol hukuman */
  [["merah", "hukM", s.hukMerah, p.hukMerah], ["biru", "hukB", s.hukBiru, p.hukBiru]].forEach(function(x){
    var kini = Array.isArray(x[2]) ? x[2].filter(function(h){ return h; }) : [];
    var dulu = Array.isArray(x[3]) ? x[3].filter(function(h){ return h; }) : [];
    var idLama = dulu.map(function(h){ return h.id; });
    el(x[1]).innerHTML = kini.map(function(h){
      var kelas = "bulat " + (Math.abs(h.nilai) >= 5 ? "berat" : "ringan") + (lama && idLama.indexOf(h.id) < 0 ? " baru" : "");
      return "<div class=\"" + kelas + "\">−" + Math.abs(h.nilai) + "</div>";
    }).join("");
  });
  /* pemenang */
  el("crownM").classList.toggle("show", s.pemenang === "merah");
  el("crownB").classList.toggle("show", s.pemenang === "biru");
  /* bantahan */
  var ov = el("overlay"), b = s.bantahan;
  if(!b){ ov.classList.remove("show"); ov.innerHTML = ""; }
  else {
    var u = b.undian || {}, km = 0, kb = 0, kt = 0;
    ["j1","j2","j3"].forEach(function(j){ if(u[j] === "merah"){ km++; } if(u[j] === "biru"){ kb++; } if(u[j] === "tiada"){ kt++; } });
    if(b.keputusan){
      ov.innerHTML = "<div class=\"o-eye\">Keputusan Pengesahan " + labelJenis(b.jenis) + "</div><div class=\"o-res " + kelasKeputusan(b.keputusan) + "\">" + teksKeputusan(b) + "</div><div class=\"o-sub\">🔴 " + km + " • 🔵 " + kb + " • ✖ " + kt + "</div>";
      if(!p.bantahan || !p.bantahan.keputusan){ beep(b.keputusan === "merah" || b.keputusan === "biru" ? 880 : 300, 0.3); }
    } else {
      ov.innerHTML = "<div class=\"o-eye\">Bantahan Jurulatih</div><div class=\"o-title\">Pengesahan " + labelJenis(b.jenis) + "</div><div class=\"o-sub\">Menunggu undian juri…</div><div class=\"o-votes\"><span class=\"km\">🔴 Merah: " + km + "</span><span class=\"kb\">🔵 Biru: " + kb + "</span><span class=\"kt\">✖ Tiada: " + kt + "</span></div>";
    }
    ov.classList.add("show");
  }
  lama = JSON.parse(JSON.stringify(s));
}

var connOn = null;
function setConn(on){ if(on === connOn){ return; } connOn = on; el("conn").classList.toggle("on", on); }

el("btnStart").addEventListener("click", function(){
  try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  var d = document.documentElement;
  if(d.requestFullscreen){ d.requestFullscreen().catch(function(){}); }
  el("start").style.display = "none";
});
document.addEventListener("dblclick", function(){
  var d = document.documentElement;
  if(!document.fullscreenElement && d.requestFullscreen){ d.requestFullscreen().catch(function(){}); }
});

fbListen("/state", render, setConn);
/* sandaran: ambil skor terus setiap 2 saat, hanya bila sambungan langsung terputus */
setInterval(function(){
  if(connOn){ return; }
  fetch(fbUrl("/state")).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    if(d && JSON.stringify(d) !== JSON.stringify(lama)){ render(d); }
    if(d){ setConn(true); }
  }).catch(function(){ setConn(false); });
}, 2000);
</script>
</body>
</html>
